<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Big Brother: All Stars Simulator</title>
<style>
:root{--bg:#0b0b12;--panel:#151522;--panel2:#1d1d2d;--text:#f7f7fb;--muted:#aaaabd;--accent:#b98cff;--danger:#ff5f72;--safe:#65d89a;--gold:#ffd86b}
*{box-sizing:border-box} body{margin:0;background:linear-gradient(135deg,#090910,#151022);color:var(--text);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
header{padding:22px 18px;border-bottom:1px solid #29293a;background:#10101a;position:sticky;top:0;z-index:5}
h1{margin:0;font-size:22px}.sub{color:var(--muted);font-size:13px;margin-top:4px}
.wrap{max-width:1100px;margin:auto;padding:16px}.grid{display:grid;grid-template-columns:1.2fr .8fr;gap:14px}
.card{background:rgba(21,21,34,.94);border:1px solid #2a2a3e;border-radius:16px;padding:15px;box-shadow:0 8px 30px #0004}
.section-title{font-size:12px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);margin-bottom:10px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.stat{background:var(--panel2);border-radius:12px;padding:10px}.stat b{display:block;font-size:18px}.stat span{font-size:11px;color:var(--muted)}
.house{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.person{padding:10px;border-radius:12px;background:var(--panel2);border:1px solid transparent}.person.you{border-color:var(--accent)}.person.elim{opacity:.4;text-decoration:line-through}.person .role{font-size:11px;color:var(--muted)}
.buttons{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.buttons button,.topbuttons button{border:0;border-radius:11px;padding:11px;background:#29293d;color:white;font-weight:650;cursor:pointer}.buttons button:hover,.topbuttons button:hover{background:#383852}
.log{height:330px;overflow:auto;background:#0d0d15;border-radius:12px;padding:10px;font-size:13px;line-height:1.45}.log p{margin:0 0 9px}.time{color:var(--accent);font-weight:700}.system{color:var(--gold)}.social{color:#76c7ff}
.relationships{display:grid;gap:7px}.rel{display:grid;grid-template-columns:100px 1fr 45px;align-items:center;gap:7px;font-size:12px}.bar{height:7px;background:#303044;border-radius:99px;overflow:hidden}.fill{height:100%;background:var(--accent)}
.topbuttons{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.topbuttons button{padding:8px 12px}
@media(max-width:800px){.grid{grid-template-columns:1fr}.house{grid-template-columns:repeat(2,1fr)}.stats{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<header><div class="wrap" style="padding:0"><h1>🏠 Big Brother: All Stars Simulator</h1><div class="sub">You play Montrose. Everyone else plays for themselves.</div></div></header>
<main class="wrap">
<div class="topbuttons">
<button onclick="saveGame()">💾 Save</button><button onclick="loadGame()">↩️ Load</button><button onclick="newGame()">🔄 New Season</button>
</div>
<div class="grid" style="margin-top:14px">
<section>
<div class="card">
<div class="section-title">Current House</div>
<div class="stats">
<div class="stat"><b id="day">1</b><span>DAY</span></div>
<div class="stat"><b id="hoh">—</b><span>HOH</span></div>
<div class="stat"><b id="nominees">—</b><span>NOMINEES</span></div>
<div class="stat"><b id="viewers">4.20m</b><span>VIEWERS</span></div>
</div>
<div style="height:12px"></div>
<div class="house" id="house"></div>
</div>

<div class="card" style="margin-top:14px">
<div class="section-title">What does Montrose do?</div>
<div class="buttons">
<button onclick="act('talk')">💬 Talk</button>
<button onclick="act('pull')">🤫 Pull someone aside</button>
<button onclick="act('eavesdrop')">🕵️ Eavesdrop</button>
<button onclick="act('diary')">🎥 Diary Room</button>
<button onclick="act('romance')">💕 Romance</button>
<button onclick="act('deal')">🤝 Make a deal</button>
<button onclick="act('rumour')">🗣️ Spread a rumour</button>
<button onclick="act('house')">🎲 House activity</button>
<button onclick="act('rest')">😴 Keep to yourself</button><button onclick="act('power')">⚡ Check/use power</button>
</div>
</div>

<div class="card" style="margin-top:14px">
<div class="section-title">Live Feed</div><div class="log" id="log"></div>
</div>
</section>

<aside>
<div class="card">
<div class="section-title">Montrose's relationships</div>
<div class="relationships" id="rels"></div>
</div>
<div class="card" style="margin-top:14px">
<div class="section-title">Current reputation</div>
<div id="rep" style="line-height:1.7;font-size:13px"></div>
</div>
<div class="card" style="margin-top:14px">
<div class="section-title">Known information</div>
<div id="info" style="font-size:13px;line-height:1.55;color:#ddd"></div>
</div>
</aside>
</div>
</main>
<script>
const cast=[
{name:"Montrose",age:18,role:"Winner • You",you:true,rel:85,trust:68,threat:82},
{name:"Boyfriend",age:24,role:"Previous-season winner",rel:95,trust:75,threat:88},
{name:"Sophie",age:26,role:"Season 1 runner-up",rel:78,trust:60,threat:76},
{name:"Aisha",age:23,role:"Season 1 returnee",rel:64,trust:48,threat:69},
{name:"Rhea",age:26,role:"Season 2 winner",rel:55,trust:52,threat:74},
{name:"Callan",age:29,role:"Season 2 runner-up",rel:48,trust:43,threat:79},
{name:"Jade",age:23,role:"Season 3 • 4th",rel:42,trust:38,threat:57},
{name:"Marcus",age:31,role:"Season 3 winner",rel:50,trust:46,threat:81},
{name:"Talia",age:25,role:"Season 4 • 3rd",rel:58,trust:55,threat:62},
{name:"Andre",age:27,role:"Season 4 • 5th",rel:45,trust:41,threat:77},
{name:"Maya",age:22,role:"Season 5 • 6th",rel:60,trust:57,threat:51},
{name:"Kane",age:30,role:"Season 5 runner-up",rel:39,trust:35,threat:86}
];

const fresh=()=>({
day:1, time:"Morning", hoh:null, nominees:[], veto:null, vetoHolder:null,
viewers:4.20, evicted:[], log:[], relationships:{}, trust:{}, alliances:[],
known:["Everyone knows Montrose and his boyfriend are together.","The house knows Montrose won his original season.","Secret conversations remain hidden unless Montrose learns about them."],
rep:{strategic:84,social:72,competition:61,trustworthy:55},
powers:["Secret Veto"], usedPowers:[], shopping:"GREEN", nominationsDone:false,
track:[], polls:{favourite:"Montrose",dangerous:"Kane",entertaining:"Jade"}
});

let state=fresh();
cast.forEach(p=>{if(!p.you){state.relationships[p.name]=p.rel;state.trust[p.name]=p.trust}});

function esc(s){return String(s).replace(/[&<>]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[m]))}
function random(a){return a[Math.floor(Math.random()*a.length)]}
function others(){return cast.filter(p=>!p.you&&!state.evicted.includes(p.name))}
function change(n,d){if(state.relationships[n]!=null)state.relationships[n]=Math.max(0,Math.min(100,state.relationships[n]+d))}
function trust(n,d){if(state.trust[n]!=null)state.trust[n]=Math.max(0,Math.min(100,state.trust[n]+d))}
function log(t,c=""){state.log.push({text:t,cls:c});if(state.log.length>120)state.log.shift();renderLog()}
function renderLog(){const e=document.getElementById("log");e.innerHTML=state.log.map(x=>`<p class="${x.cls}">${x.text}</p>`).join("");e.scrollTop=e.scrollHeight}
function render(){
 document.getElementById("day").textContent=state.day;
 document.getElementById("hoh").textContent=state.hoh||"—";
 document.getElementById("nominees").textContent=state.nominees.length?state.nominees.join(" / "):"—";
 document.getElementById("viewers").textContent=state.viewers.toFixed(2)+"m";
 document.getElementById("house").innerHTML=cast.map(p=>`<div class="person ${p.you?"you":""} ${state.evicted.includes(p.name)?"elim":""}">
 <b>${p.you?"⭐ ":""}${p.name}</b><div class="role">${p.role}</div>
 ${state.hoh===p.name?'<div style="color:#ffd86b;font-size:11px">👑 HOH</div>':''}
 ${state.nominees.includes(p.name)?'<div style="color:#ff7180;font-size:11px">🟥 NOMINATED</div>':''}
 ${state.evicted.includes(p.name)?'<div style="color:#ff7180;font-size:11px">⬛ EVICTED</div>':''}</div>`).join("");
 document.getElementById("rels").innerHTML=others().map(p=>`<div class="rel"><span>${p.name}</span><div class="bar"><div class="fill" style="width:${state.relationships[p.name]}%"></div></div><span>${Math.round(state.relationships[p.name])}</span></div>`).join("");
 document.getElementById("rep").innerHTML=`Strategic threat: <b>${state.rep.strategic}/100</b><br>Social: <b>${state.rep.social}/100</b><br>Competition: <b>${state.rep.competition}/100</b><br>Trustworthiness: <b>${state.rep.trustworthy}/100</b><hr style="border-color:#29293a">Shopping: <b>${state.shopping}</b><br>Power: <b>${state.powers.filter(x=>!state.usedPowers.includes(x)).join(", ")||"None"}</b>`;
 document.getElementById("info").innerHTML=state.known.slice(-12).map(x=>`• ${esc(x)}`).join("<br>");
 renderLog();
}
function chooseTarget(title="Choose a housemate"){
 const live=others();
 const names=live.map((p,i)=>`${i+1}. ${p.name}`).join("\n");
 const n=parseInt(prompt(`${title}\n\n${names}`),10);
 return Number.isInteger(n)&&live[n-1]?live[n-1]:null;
}
function act(type){
 if(state.evicted.includes("Montrose"))return;
 let t;
 if(type==="talk"){t=chooseTarget("Who do you want to talk to?");if(!t)return;change(t.name,4);trust(t.name,2);state.rep.social=Math.min(100,state.rep.social+1);log(`<span class="time">${state.time}</span> Montrose talks with <b>${t.name}</b>. They exchange gossip and quietly compare the house's threat levels.`)}
 if(type==="pull"){t=chooseTarget("Who do you want to pull aside?");if(!t)return;change(t.name,6);trust(t.name,4);log(`<span class="time">${state.time}</span> Montrose pulls <b>${t.name}</b> aside. The conversation feels more serious than a normal chat.`)}
 if(type==="eavesdrop"){let a=random(others()),b=random(others().filter(x=>x.name!==a.name));log(`<span class="social">Live Feed</span> Montrose overhears <b>${a.name}</b> talking privately with <b>${b.name}</b>. You catch: “Montrose is going to be a problem eventually.”`);state.known.push(`${a.name} was overheard discussing Montrose with ${b.name}.`)}
 if(type==="diary"){log(`<span class="time">${state.time}</span> <b>Diary Room:</b> Big Brother asks Montrose whether he trusts his boyfriend completely. The answer stays private.`,"system");state.rep.strategic=Math.min(100,state.rep.strategic+1)}
 if(type==="romance"){change("Boyfriend",5);trust("Boyfriend",3);state.rep.social=Math.min(100,state.rep.social+1);log(`<span class="time">${state.time}</span> Montrose spends time with his boyfriend. The couple's closeness is becoming a major part of the house dynamic.`)}
 if(type==="deal"){t=chooseTarget("Who do you want to offer a Final Two deal to?");if(!t)return;change(t.name,7);trust(t.name,5);state.alliances.push(`Final Two: Montrose + ${t.name}`);state.known.push(`You offered ${t.name} a Final Two deal.`);log(`<span class="time">${state.time}</span> Montrose offers <b>${t.name}</b> a quiet Final Two deal. They say they need time to think.`)}
 if(type==="rumour"){t=chooseTarget("Who do you want to spread a rumour about?");if(!t)return;change(t.name,-5);state.rep.trustworthy=Math.max(0,state.rep.trustworthy-3);log(`<span class="time">${state.time}</span> Montrose spreads a rumour about <b>${t.name}</b>. It reaches at least two other people before the hour is over.`)}
 if(type==="house"){let activity=random(["a pool tournament","a cooking task","a karaoke session","a garden game","a quiz night"]);t=random(others());change(t.name,3);log(`<span class="time">${state.time}</span> The house plays <b>${activity}</b>. Montrose and ${t.name} end up laughing together.`)}
 if(type==="rest"){log(`<span class="time">${state.time}</span> Montrose keeps to himself. While he is away from the main group, other housemates make their own plans.`)}
 if(type==="power"){usePower()}
 advanceTime();
}
function usePower(){
 const available=state.powers.filter(x=>!state.usedPowers.includes(x));
 if(!available.length){log(`<span class="system">POWER</span> Montrose has no unused powers.`,"system");return}
 const p=available[0];
 if(p==="Secret Veto"){state.usedPowers.push(p);state.vetoHolder="Montrose";log(`<span class="system">SECRET VETO</span> Montrose secretly claims the Secret Veto. Its existence is not announced to the house.`,"system")}
}
function advanceTime(){
 const phases=["Morning","Afternoon","Evening"];
 const idx=phases.indexOf(state.time);
 if(idx<2){state.time=phases[idx+1];aiMove();render();return}
 endDay();
}
function aiMove(){
 if(Math.random()<.8){
  let a=random(others()),b=random(others().filter(x=>x.name!==a.name));
  let positive=Math.random()>.42;change(a.name,positive?2:-3);trust(a.name,positive?1:-2);
  log(`<span class="social">Live Feed</span> While Montrose wasn't involved, <b>${a.name}</b> and <b>${b.name}</b> have a private strategy conversation.`,"social");
 }
}
function endDay(){
 state.day++;state.time="Morning";state.viewers=Math.max(2,Math.min(8.5,state.viewers+(Math.random()*.18-.03)));
 if(state.day%4===0)runHoH();
 if(state.day%3===0)runSocialPulse();
 if(state.day%5===0)runShopping();
 log(`<span class="system">END OF DAY</span> Day ${state.day-1} closes. The house keeps moving even when Montrose isn't in the room.`,"system");
 log(`<span class="social">LATE & LIVE</span> Viewer count: <b>${state.viewers.toFixed(2)}m</b>. Public chatter is focusing on the power-couple storyline and the growing strategic tension.`,"social");
 render();
}
function runHoH(){
 let live=others();if(!live.length)return;
 let winner=random(live);state.hoh=winner.name;state.nominees=[];state.nominationsDone=false;
 log(`<span class="system">👑 HOH</span> <b>${winner.name}</b> wins the Head of House competition.`, "system");
 nominate();
}
function nominate(){
 if(!state.hoh)return;
 const eligible=others().filter(p=>p.name!==state.hoh);
 const ranked=[...eligible].sort((a,b)=>(state.relationships[a.name]-state.trust[a.name])-(state.relationships[b.name]-state.trust[b.name]));
 let n1=ranked[0],n2=ranked[1];
 // A high-threat HoH can make a strategic shot rather than simply choosing low relationships.
 if(Math.random()<.5)n1=[...eligible].sort((a,b)=>b.threat-a.threat)[0];
 if(n2.name===n1.name)n2=ranked.find(x=>x.name!==n1.name);
 state.nominees=[n1.name,n2.name];state.nominationsDone=true;
 log(`<span class="system">🟥 NOMINATIONS</span> ${state.hoh} nominates <b>${n1.name}</b> and <b>${n2.name}</b>.`, "system");
}
function runSocialPulse(){
 const live=others();if(!live.length)return;
 let target=[...live].sort((a,b)=>b.threat-a.threat)[0];
 state.known.push(`House consensus is increasingly that ${target.name} is a major strategic threat.`);
 log(`<span class="social">PUBLIC POLL</span> “Most likely to betray” is currently <b>${state.polls.dangerous}</b>. “Most entertaining” is <b>${state.polls.entertaining}</b>.`,"social");
}
function runShopping(){
 const levels=["GREEN","GREEN","YELLOW","GREEN","RED"];state.shopping=random(levels);
 log(`<span class="system">🛒 SHOPPING TASK</span> The house receives a <b>${state.shopping}</b> budget this week.`,"system");
}
function saveGame(){localStorage.bbAllStars=JSON.stringify(state);log(`<span class="system">💾 SAVED</span> Your season has been saved in this browser.`,"system")}
function loadGame(){if(localStorage.bbAllStars){state=JSON.parse(localStorage.bbAllStars);render();log(`<span class="system">↩️ LOADED</span> Saved season restored.`,"system")}else log(`<span class="system">No saved season found.</span>`,"system")}
function newGame(){if(confirm("Start a completely new All Stars season?")){localStorage.removeItem("bbAllStars");state=fresh();cast.forEach(p=>{if(!p.you){state.relationships[p.name]=p.rel;state.trust[p.name]=p.trust}});boot()}}
function boot(){
 log(`<span class="system">DAY 1 — ALL STARS</span> Twelve All Stars enter the house. Everyone knows Montrose and his boyfriend are together — and both have already won before.`,"system");
 log(`<span class="time">Morning</span> The first conversations begin. No alliance is guaranteed. Every housemate has their own agenda.`,"");
 render();
}
boot();
</script>
</body>
</html>
